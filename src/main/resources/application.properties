#start docker-rele-code

spring.application.name=pharmase_monolithi

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pharmase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:database2025}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis

# Logging
logging.level.root=INFO
logging.level.com.soumen.MedicalAI=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

#end docker-rele-code

resend.api=${RESEND_API_KEY}
resend.from=Pharmase <soumenmaity.fd2@gmail.com>

